services:
  backend:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - "8000:8000"
    restart: unless-stopped

  redis:
    image: redis:latest
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
